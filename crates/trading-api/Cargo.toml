[package]
name = "trading-api"
version.workspace = true
edition.workspace = true
description = "HTTP/gRPC API handlers for GridTokenX trading service"

[dependencies]
trading-core.workspace = true
gridtokenx-telemetry.workspace = true
trading-protocol.workspace = true
trading-logic.workspace = true
trading-infra.workspace = true
trading-engine.workspace = true

# Web framework
axum.workspace = true
tower-http.workspace = true
connectrpc.workspace = true
buffa.workspace = true
http-body.workspace = true

# Async
tokio.workspace = true
tokio-util = { workspace = true, features = ["full"] }
async-trait.workspace = true

# Types
chrono.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true

# Blockchain (for ServiceRole auth)
gridtokenx-blockchain-auth = { workspace = true, features = ["axum"] }
solana-sdk.workspace = true

# Observability
tracing.workspace = true
metrics.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
bs58.workspace = true
thiserror.workspace = true

# Error handling
anyhow.workspace = true

# API docs
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
