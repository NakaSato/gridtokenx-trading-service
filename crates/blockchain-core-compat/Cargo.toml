[package]
name = "gridtokenx-blockchain-core-compat"
version = "0.1.0"
edition = "2021"
description = "Shared blockchain utilities for GridTokenX services (compat version)"
 
[features]
mocks = []

[dependencies]
# Solana SDK
solana-sdk = "2.1.0"
solana-transaction-status = "2.2.1"
solana-program = "2.1.0"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }

# Anchor
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }

# SPL Tokens
spl-token = "8.0.0"
spl-token-2022 = "6.0.0"
spl-associated-token-account = { version = "7.0.0", features = ["no-entrypoint"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.21"
bs58 = "0.5"
hex = "0.4"

# Async Runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
async-trait = "0.1"
futures = "0.3"

# Web Framework
axum = { version = "0.7.9", features = ["macros"] }
tower = "0.5"
tower-http = "0.6.2"

# gRPC
tonic = { version = "0.12.3", features = ["tls", "tls-native-roots"] }
prost = "0.13"

# Cryptography
aes-gcm = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
rust_decimal = "1.33"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Messaging
async-nats = "0.37"

[dev-dependencies]
tokio-test = "0.4"

[build-dependencies]
tonic-build = "0.12.3"
prost-build = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
