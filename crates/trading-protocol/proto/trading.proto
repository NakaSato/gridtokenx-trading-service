syntax = "proto3";

package trading;

service TradingService {
  // Trading Operations
  rpc SubmitOrder (SubmitOrderRequest) returns (TradingResponse);
  rpc CancelOrder (CancelOrderRequest) returns (TradingResponse);
  rpc UpdateOrder (UpdateOrderRequest) returns (TradingResponse);
  rpc GetOrder (GetOrderRequest) returns (OrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  rpc NotifyOrder (NotifyOrderRequest) returns (TradingResponse);
  rpc GetOrderBook (GetOrderBookRequest) returns (ListOrdersResponse);
  rpc ListTrades (ListTradesRequest) returns (ListTradesResponse);

  // Settlement Operations
  rpc ExecuteSettlement (ExecuteSettlementRequest) returns (SettlementResponse);
  rpc BatchExecuteSettlements (BatchExecuteSettlementsRequest) returns (BatchSettlementResponse);

  // ERC Operations (Energy Registration & Carbon)
  rpc IssueERC (IssueERCRequest) returns (TradingResponse);
  rpc TransferERC (TransferERCRequest) returns (TradingResponse);
  rpc RetireERC (RetireERCRequest) returns (TradingResponse);
  rpc GetERCBalance (GetERCBalanceRequest) returns (ERCBalanceResponse);

  // Market Engine Operations (P2P)
  rpc CalculateP2PCost (CalculateP2PCostRequest) returns (P2PTransactionCost);
  rpc GetMarketPrices (google.protobuf.Empty) returns (P2PMarketPrices);
  rpc RelayOrder (RelayOrderRequest) returns (TradingResponse);

  // Market & Status Operations
  rpc GetBlockchainMarketData (google.protobuf.Empty) returns (BlockchainMarketDataResponse);
  rpc GetMarketStats (google.protobuf.Empty) returns (MarketStatsResponse);
  rpc GetMatchingStatus (google.protobuf.Empty) returns (MatchingStatusResponse);
  rpc GetSettlementStats (google.protobuf.Empty) returns (SettlementStatsResponse);
  rpc GetTokenBalance(GetTokenBalanceRequest) returns (TokenBalanceResponse);

  // Conditional Orders
  rpc CreateConditionalOrder(CreateConditionalOrderRequest) returns (TradingResponse);
  rpc ListConditionalOrders(ListConditionalOrdersRequest) returns (ListConditionalOrdersResponse);
  rpc CancelConditionalOrder(CancelConditionalOrderRequest) returns (TradingResponse);
  rpc GetConditionalOrder(GetConditionalOrderRequest) returns (ConditionalOrderData);

  // Recurring Order Operations
  rpc CreateRecurringOrder (CreateRecurringOrderRequest) returns (TradingResponse);
  rpc ListRecurringOrders (ListRecurringOrdersRequest) returns (ListRecurringOrdersResponse);
  rpc GetRecurringOrder (GetRecurringOrderRequest) returns (RecurringOrderResponse);
  rpc CancelRecurringOrder (CancelRecurringOrderRequest) returns (TradingResponse);
  rpc PauseRecurringOrder (PauseRecurringOrderRequest) returns (TradingResponse);
  rpc ResumeRecurringOrder (ResumeRecurringOrderRequest) returns (TradingResponse);

  // VPP (Virtual Power Plant) Operations
  rpc GetVppCluster (GetVppClusterRequest) returns (VppClusterResponse);
  rpc ListVppClusters (ListVppClustersRequest) returns (ListVppClustersResponse);
  rpc DispatchVpp (DispatchVppRequest) returns (TradingResponse);
}

import "google/protobuf/empty.proto";

message SubmitOrderRequest {
  string user_id = 1;
  double energy_amount = 2;
  double price_per_kwh = 3;
  string side = 4; // "buy" or "sell"
  string order_type = 5; // "limit", "market", etc.
  string meter_id = 6;
  string session_token = 7;
  optional int32 zone_id = 8;
  optional string time_in_force = 9; // "gtc" (default), "ioc", "fok"
  optional string market_segment = 10; // "realtime" (default), "interval"
  // Order lifetime; send at most one. Omitted → ORDER_DEFAULT_TTL_SECS.
  // Mirrors the REST edge (rest.rs SubmitOrderRequest) so the two transports
  // offer the same control; resolved by order_policy::resolve_expires_at.
  optional string expires_at = 11;     // absolute, RFC 3339
  optional int64 expires_in_secs = 12; // relative to now, seconds
}

message UpdateOrderRequest {
  string order_id = 1;
  string user_id = 2;
  optional double energy_amount = 3;
  optional double price_per_kwh = 4;
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

message ListOrdersRequest {
  string user_id = 1;
  optional string status = 2;
}

message GetOrderBookRequest {
  optional int32 zone_id = 1;
  optional string side = 2;
}

message NotifyOrderRequest {
  string order_id = 1;
  optional int32 zone_id = 2;
}

message TradingResponse {
  bool success = 1;
  string message = 2;
  optional string id = 3; // e.g., order_id or transaction_id
}

message OrderResponse {
  string id = 1;
  string user_id = 2;
  double energy_amount = 3;
  double price_per_kwh = 4;
  double filled_amount = 5;
  string side = 6;
  string status = 7;
  string created_at = 8;
  optional int32 zone_id = 9;
}

message ListOrdersResponse {
  repeated OrderResponse orders = 1;
}

message ListTradesRequest {
  string user_id = 1;
  optional int32 limit = 2;
  optional int32 zone_id = 3;
}

message TradeResponse {
  string id = 1;
  double quantity = 2;
  double price = 3;
  double total_value = 4;
  string role = 5; // "buyer" or "seller"
  string counterparty_id = 6;
  string executed_at = 7;
  string status = 8;
  optional double wheeling_charge = 9;
  optional double loss_cost = 10;
  optional double effective_energy = 11;
  optional int32 buyer_zone_id = 12;
  optional int32 seller_zone_id = 13;
}

message ListTradesResponse {
  repeated TradeResponse trades = 1;
}

message IssueERCRequest {
  string user_id = 2;
  string meter_id = 3;
  double energy_amount = 4;
}

message TransferERCRequest {
  string from_user_id = 1;
  string to_user_id = 2;
  double amount = 3;
}

message RetireERCRequest {
  string user_id = 1;
  double amount = 2;
  string reason = 3;
}

message GetERCBalanceRequest {
  string user_id = 1;
}

message ERCBalanceResponse {
  double balance = 1;
  string asset_type = 2; // e.g., "KWH_CERT"
}

// =============================================================================
// P2P/Market Engine Types
// =============================================================================

message CalculateP2PCostRequest {
  int32 buyer_zone_id = 1;
  int32 seller_zone_id = 2;
  double energy_amount = 3;
  optional double agreed_price = 4;
}

message P2PTransactionCost {
  double energy_cost = 1;
  double wheeling_charge = 2;
  double loss_cost = 3;
  double total_cost = 4;
  double effective_energy = 5;
  double loss_factor = 6;
  string loss_allocation = 7;
  double zone_distance_km = 8;
  int32 buyer_zone = 9;
  int32 seller_zone = 10;
  bool is_grid_compliant = 11;
  optional string grid_violation_reason = 12;
}

message P2PMarketPrices {
  double base_price_thb_kwh = 1;
  double grid_import_price_thb_kwh = 2;
  double grid_export_price_thb_kwh = 3;
  string loss_allocation_model = 4;
  map<string, double> wheeling_charges = 5;
  map<string, double> loss_factors = 6;
}

message RelayOrderRequest {
  string order_id = 1; // hex encoded
  string user_pubkey = 2;
  uint64 energy_amount = 3;
  uint64 price_per_kwh = 4;
  int32 side = 5; // 0 for Buy, 1 for Sell
  int32 zone_id = 6;
  int64 expires_at = 7;
  bytes signature = 8;
}

// =============================================================================
// Market & Status Responses
// =============================================================================

message BlockchainMarketDataResponse {
  bool success = 1;
  string message = 2;
  string authority = 3;
  uint64 active_orders = 4;
  uint64 total_volume = 5;
  uint64 total_trades = 6;
  uint32 market_fee_bps = 7;
  bool clearing_enabled = 8;
  int64 created_at = 9;
}

message MarketStatsResponse {
  double average_price = 1;
  double total_volume = 2;
  int64 active_orders = 3;
  int64 pending_orders = 4;
  int64 completed_matches = 5;
}

message MatchingStatusResponse {
  int64 pending_buy_orders = 1;
  int64 pending_sell_orders = 2;
  int64 pending_matches = 3;
  double buy_min_price = 4;
  double buy_max_price = 5;
  double sell_min_price = 6;
  double sell_max_price = 7;
  bool can_match = 8;
  string match_reason = 9;
}

message SettlementStatsResponse {
  int64 pending_count = 1;
  int64 processing_count = 2;
  int64 confirmed_count = 3;
  int64 failed_count = 4;
  double total_settled_value = 5;
  repeated RecentSettlementResponse recent_settlements = 6;
}

message RecentSettlementResponse {
  string id = 1;
  string status = 2;
  double energy_amount = 3;
  double total_amount = 4;
  string created_at = 5;
}

message GetTokenBalanceRequest {
  string wallet_address = 1;
  string mint_address = 2;
}

message TokenBalanceResponse {
  string wallet_address = 1;
  double token_balance = 2;
  uint64 raw_balance = 3;
  string mint = 4;
}

// Conditional Orders
message CreateConditionalOrderRequest {
  string user_id = 1;
  string side = 2;
  double energy_amount = 3;
  double trigger_price = 4;
  string trigger_type = 5;
  optional double limit_price = 6;
  optional double trailing_offset = 7;
  optional string expiry_time = 8;
  optional string session_token = 9;
}

message ListConditionalOrdersRequest {
  string user_id = 1;
}

message ListConditionalOrdersResponse {
  repeated ConditionalOrderData orders = 1;
}

message GetConditionalOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message ConditionalOrderData {
  string id = 1;
  string user_id = 2;
  string side = 3;
  double energy_amount = 4;
  double trigger_price = 5;
  string trigger_type = 6;
  string trigger_status = 7;
  optional double limit_price = 8;
  optional double trailing_offset = 9;
  optional string expires_at = 10;
  string created_at = 11;
  optional string triggered_at = 12;
  optional double last_peak_price = 13;
}

message CancelConditionalOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

// Recurring Order Messages (DCA)
// =============================================================================
// Recurring Order Types
// =============================================================================

message CreateRecurringOrderRequest {
  string user_id = 1;
  string side = 2; // "buy" or "sell"
  double energy_amount = 3;
  double max_price_per_kwh = 4;
  double min_price_per_kwh = 5;
  string interval_type = 6; // "hourly", "daily", "weekly", "monthly"
  optional int32 interval_value = 7;
  optional int32 max_executions = 8;
  string name = 9;
  string description = 10;
  optional string session_token = 11;
}

message ListRecurringOrdersRequest {
  string user_id = 1;
}

message ListRecurringOrdersResponse {
  repeated RecurringOrderData orders = 1;
}

message GetRecurringOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message RecurringOrderResponse {
  string id = 1;
  string status = 2;
  string next_execution_at = 3;
  string created_at = 4;
  string message = 5;
}

message RecurringOrderData {
  string id = 1;
  string user_id = 2;
  string side = 3;
  double energy_amount = 4;
  double max_price_per_kwh = 5;
  double min_price_per_kwh = 6;
  string interval_type = 7;
  int32 interval_value = 8;
  string next_execution_at = 9;
  optional string last_executed_at = 10;
  string status = 11;
  int32 total_executions = 12;
  optional int32 max_executions = 13;
  string name = 14;
  string description = 15;
  string created_at = 16;
  string updated_at = 17;
}

message CancelRecurringOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message PauseRecurringOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message ResumeRecurringOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

// =============================================================================
// VPP (Virtual Power Plant) Orchestration
// =============================================================================

message GetVppClusterRequest {
  string cluster_id = 1;
}

message ListVppClustersRequest {
  optional int32 zone_id = 1;
}

message VppClusterResponse {
  string cluster_id = 1;
  optional int32 zone_id = 2;
  double total_capacity_kwh = 3;
  double current_stored_kwh = 4;
  double soc_percentage = 5;
  double target_soc_percentage = 6;
  double flex_up_kw = 7;
  double flex_down_kw = 8;
  double health_score = 9;
  int32 resource_count = 10;
  string dispatch_mode = 11;
  string last_update = 12;
}

message ListVppClustersResponse {
  repeated VppClusterResponse clusters = 1;
}

message DispatchVppRequest {
  string cluster_id = 1;
  string dispatch_mode = 2; // "idle", "charge", "discharge", "balancing"
  double target_soc = 3;
  double target_kw = 4;
}

// Settlement Messages
message ExecuteSettlementRequest {
  string settlement_id = 1;
  string buy_order_pda = 2;
  string sell_order_pda = 3;
  string buyer_wallet = 4;
  string seller_wallet = 5;
  double energy_amount = 6;
  double price = 7;
  optional double wheeling_charge = 8;
  optional double loss_cost = 9;
}

message BatchExecuteSettlementsRequest {
  repeated ExecuteSettlementRequest settlements = 1;
}

message SettlementResponse {
  bool success = 1;
  string message = 2;
  string signature = 3;
  uint64 slot = 4;
}

message BatchSettlementResponse {
  bool success = 1;
  string message = 2;
  string signature = 3;
  uint64 slot = 4;
  repeated string settlement_ids = 5;
}

