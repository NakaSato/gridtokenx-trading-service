[package]
name = "trading-protocol"
version.workspace = true
edition.workspace = true
description = "Protobuf / ConnectRPC wire types for GridTokenX trading service"

[lib]
# The lib is generated ConnectRPC/buffa code; its doc-comment examples are
# codegen boilerplate that does not compile as standalone doctests. Skip them so
# `cargo test --workspace` isn't redded by non-tests.
doctest = false

[dependencies]
serde.workspace = true
buffa.workspace = true
connectrpc.workspace = true
futures.workspace = true
http-body.workspace = true

[build-dependencies]
connectrpc-build.workspace = true

[lints.rust]
# Generated ConnectRPC/buffa code uses unsafe trait impls (DefaultInstance, DefaultViewInstance)
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
