[package]
name = "iam-protocol-compat"
version = "0.1.1"
edition = "2021"
description = "Compat library for identity connectrpc definitions using connectrpc 0.2.1"

[dependencies]
connectrpc = { version = "0.2.1", features = ["client", "axum", "server"] }
buffa = "0.2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
http = "1.0.0"
http-body = "1.0.0"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
connectrpc-build = "0.2.0"
buffa-build = "0.2.0"
