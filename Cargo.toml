[workspace]
resolver = "2"
members = [
    "crates/trading-core",
    "crates/trading-protocol",
    "crates/trading-engine",
    "crates/trading-persistence",
    "crates/trading-infra",
    "crates/trading-logic",
    "crates/trading-api",
    "bin/trading-service",
    "crates/iam-protocol-compat",
    "crates/blockchain-core-compat",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
description = "Trading and ERC microservice for GridTokenX"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[workspace.dependencies]
# ── Internal Crates ──────────────────────────────────────────────────────────
trading-core = { path = "crates/trading-core" }
trading-protocol = { path = "crates/trading-protocol" }
trading-engine = { path = "crates/trading-engine" }
trading-persistence = { path = "crates/trading-persistence" }
trading-infra = { path = "crates/trading-infra" }
trading-logic = { path = "crates/trading-logic" }
trading-api = { path = "crates/trading-api" }
iam-protocol = { package = "iam-protocol-compat", path = "crates/iam-protocol-compat" }

# ── Async Runtime ────────────────────────────────────────────────────────────
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "time",
    "sync",
    "signal",
    "parking_lot",
] }
futures = "0.3"
async-trait = "0.1"
tokio-util = "0.7.18"

# ── Database ─────────────────────────────────────────────────────────────────
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-rustls",
    "chrono",
    "uuid",
    "rust_decimal",
    "ipnetwork",
] }
rust_decimal = { version = "1.33", features = ["serde-float", "maths"] }

# ── Serialization ────────────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── Observability ────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.17"

# ── Web Framework ────────────────────────────────────────────────────────────
axum = { version = "0.7.9", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace"] }

# ── gRPC / ConnectRPC ────────────────────────────────────────────────────────
connectrpc = { version = "0.2.1", features = ["client", "axum", "server"] }
buffa = "0.2.0"
http-body = "1.0.0"
http = "1.0.0"

# ── Utilities ────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
anyhow = "1.0"
thiserror = "2.0"
dashmap = "6.1.0"
dotenvy = "0.15"
bs58 = "0.5"
rand = "0.8"
regex = "1.10"
ulid = { version = "1.0", features = ["serde"] }
validator = { version = "0.19", features = ["derive"] }
ipnetwork = { version = "0.20", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
smallvec = { version = "1.13", features = ["union"] }
utoipa = { version = "5.0", features = ["decimal", "chrono", "uuid"] }
parking_lot = "0.12"

# ── Caching / PubSub ────────────────────────────────────────────────────────
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
rdkafka = { version = "0.37", features = ["zstd"] }

# ── Blockchain ───────────────────────────────────────────────────────────────
gridtokenx-blockchain-core = { package = "gridtokenx-blockchain-core-compat", path = "crates/blockchain-core-compat" }
solana-client = "2.1.0"
solana-sdk = "2.1.0"
solana-program = "2.1.0"
spl-token = "8.0.0"
spl-associated-token-account = "7.0.0"
spl-token-2022 = "8.0.0"
solana-transaction-status = "2.1.0"

# ── Crypto ───────────────────────────────────────────────────────────────────
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
aes-gcm = "0.10"
base64 = "0.21"
rustls = { version = "0.23", features = ["ring"] }
ed25519-dalek = "2.1"
hex = "0.4.3"

# ── Build Dependencies ──────────────────────────────────────────────────────
buffa-build = "0.2.0"
connectrpc-build = "0.2.0"

# ── Test Dependencies ───────────────────────────────────────────────────────
once_cell = "1.19"
rust_decimal_macros = "1.36"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
