[package]
name = "gridtokenx-trading-service"
version = "0.1.0"
edition = "2021"
description = "Trading and ERC microservice for GridTokenX"

[dependencies]
# Async Runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Database
# Note: Offline mode in sqlx 0.8+ is enabled via SQLX_OFFLINE=true env var
sqlx = { workspace = true, features = [
  "postgres",
  "runtime-tokio-rustls",
  "chrono",
  "uuid",
  "rust_decimal",
] }
rust_decimal = { workspace = true, features = ["serde-float", "maths"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
regex = { workspace = true }
axum = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
dotenvy = { workspace = true }
bs58 = { workspace = true }
rand = { workspace = true }

# Caching/PubSub
redis = { workspace = true, features = ["tokio-comp", "connection-manager"] }

# Blockchain
solana-client = { workspace = true }
solana-sdk = { workspace = true }
solana-program = { workspace = true }
spl-token = { workspace = true }
spl-associated-token-account = { workspace = true }

# gRPC
connectrpc = { workspace = true }
buffa = "0.2.0"

# Others
spl-token-2022 = { workspace = true }
solana-transaction-status = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
pbkdf2 = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
utoipa = { workspace = true }
ulid = { workspace = true }
validator = { workspace = true }
ipnetwork = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
http-body = "1.0.0"

[build-dependencies]
buffa-build = "0.2.0"
connectrpc-build = "0.2.0"

[dev-dependencies]
once_cell = "1.19"
rust_decimal_macros = { workspace = true }
tokio-test = { workspace = true }
