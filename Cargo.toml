[package]
name = "gridtokenx-trading-service"
version = "0.1.1"
edition = "2021"
description = "Trading and ERC microservice for GridTokenX"

[dependencies]
# Async Runtime
tokio = { version = "1.48", features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "time",
  "sync",
  "signal",
  "parking_lot",
] }
futures = "0.3"
async-trait = "0.1"

# Database
# Note: Offline mode in sqlx 0.8+ is enabled via SQLX_OFFLINE=true env var
sqlx = { version = "0.8", features = [
  "postgres",
  "runtime-tokio-rustls",
  "chrono",
  "uuid",
  "rust_decimal",
  "ipnetwork",
] }
rust_decimal = { version = "1.33", features = ["serde-float", "maths"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
regex = "1.10"
axum = { version = "0.8.7", features = ["macros"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
anyhow = "1.0"
thiserror = "2.0"
dashmap = "6.1.0"
dotenvy = "0.15"
bs58 = "0.5"
rand = "0.8"

# Caching/PubSub
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

# Blockchain
gridtokenx-blockchain-core = { path = "../gridtokenx-blockchain-core" }
solana-client = "2.1.0"
solana-sdk = "2.1.0"
solana-program = "2.1.0"
spl-token = "8.0.0"
spl-associated-token-account = "7.0.0"

# gRPC
connectrpc = { version = "0.2.1", features = ["client", "axum", "server"] }
buffa = "0.2.0"

# Others
spl-token-2022 = "8.0.0"
solana-transaction-status = "2.1.0"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
aes-gcm = "0.10"
base64 = "0.21"
utoipa = { version = "5.0", features = ["decimal", "chrono", "uuid"] }
ulid = { version = "1.0", features = ["serde"] }
validator = { version = "0.19", features = ["derive"] }
ipnetwork = { version = "0.20", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
http-body = "1.0.0"
tokio-util = "0.7.18"
smallvec = { version = "1.13", features = ["union"] }
rdkafka = { version = "0.37", features = ["zstd"] }

[build-dependencies]
buffa-build = "0.2.0"
connectrpc-build = "0.2.0"

[dev-dependencies]
once_cell = "1.19"
rust_decimal_macros = "1.36"
tokio-test = "0.4"
