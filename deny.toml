# cargo-deny configuration for GridTokenX trading service

# Root options
[graph]
# metadata will be collected with `--all-features`
all-features = true
no-default-features = false

[output]
feature-depth = 1

# Advisory checking
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = [
    # Add specific RUSTSEC IDs here if needed
]

# License checking
[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# Bans checking
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

allow = []
deny = []

# Skip certain crates for duplicate detection if they are unavoidable
skip = [
    # Examples of common duplicates that are hard to avoid
    #"winapi@0.3.9",
]
skip-tree = []

# Source checking
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["NakaSato"] # Allow internal NakaSato repos if used via git
